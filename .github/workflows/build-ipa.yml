name: GUIZADO TV - IPA iPhone
on:
  push:
    branches: [main]
    paths: ['GUIZADO-TV-iOS-proyecto.zip', 'native/**', '.github/workflows/build-ipa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Extraer proyecto nativo
        run: |
          unzip -q GUIZADO-TV-iOS-proyecto.zip
          if [ -d GUIZADO-TV-iOS/GuizadoTV/Resources ]; then
            mv GUIZADO-TV-iOS/GuizadoTV/Resources GUIZADO-TV-iOS/GuizadoTV/MediaAssets
          fi
          cp -R native/. GUIZADO-TV-iOS/
      - name: Verificar proyecto y ejecutar comprobaciones
        working-directory: GUIZADO-TV-iOS
        run: |
          xcodebuild -version
          plutil -lint GuizadoTV/Info.plist GuizadoTV.xcodeproj/project.pbxproj
          sh check-core.sh
      - name: Compilar para iPhone y empaquetar IPA
        working-directory: GUIZADO-TV-iOS
        run: bash ci/build-unsigned.sh
      - name: Probar arranque en iPhone simulado
        working-directory: GUIZADO-TV-iOS
        run: bash ci/smoke-simulator.sh
      - name: Guardar IPA
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: GUIZADO-TV-iPhone-IPA-sin-firma
          path: GUIZADO-TV-iOS/artifacts/
          if-no-files-found: error
          retention-days: 14

